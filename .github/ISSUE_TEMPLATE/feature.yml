name: Feature request
description: Something the planner should be able to do and cannot.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: want
    attributes:
      label: What do you want it to do
      placeholder: Compare two builds side by side.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to achieve
      description: >
        The problem behind the request. Knowing what you are actually trying to work out often
        leads to a better answer than the feature as described.
      placeholder: >
        Deciding whether to swap a ring. Right now I copy the numbers into a text file, change
        the ring, and compare by hand.
    validations:
      required: true
